databases:
  - name: teacher-system2-db
    databaseName: teacher_system
    user: teacher_user
    plan: free

services:
  - type: web
    name: teachersys
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: teacher-system2-db
          property: connectionString
      - key: ENABLE_DEMO_SEED
        value: "1"
      - key: DATA_DIR
        value: "/app/data"
      - key: STORAGE_ROOT
        value: "/app/backend/storage"
      - key: INTERNAL_API_URL
        value: "http://127.0.0.1:8000"
      - key: PILOT_ACCESS_PIN
        value: ""
