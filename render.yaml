databases:
  - name: teacher-system2-db
    databaseName: teacher_system
    user: teacher_user
    plan: free

services:
  - type: web
    name: teachersys
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: teacher-system2-db
          property: connectionString
      - key: ENABLE_DEMO_SEED
        value: "0"
      - key: DATA_DIR
        value: "/app/data"
      - key: STORAGE_ROOT
        value: "/app/backend/storage"
      - key: INTERNAL_API_URL
        value: "http://127.0.0.1:8000"
      - key: OMNIROUTE_BASE_URL
        value: "http://100.120.103.82:20128/v1"
      - key: OMNIROUTE_API_KEY
        sync: false
      - key: OMNIROUTE_ALLOW_KEYLESS
        value: "0"
      - key: TAILSCALE_AUTHKEY
        value: ""
      - key: NVIDIA_API_KEYS
        value: ""
      - key: PILOT_ACCESS_PIN
        sync: false
